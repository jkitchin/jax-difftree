[project]
name = "difftree"
version = "0.1.0"
description = "Differentiable oblique decision trees in JAX with built-in UQ"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.0",
    "numpy>=2.4.4",
    "optax>=0.2.8",
    "scikit-learn>=1.8.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/difftree"]
